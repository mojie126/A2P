name: dev-build

# 手动触发的开发构建：Windows 与 Linux amd64 编译打包，产物挂到草稿 Release。
#
# 与上游 build.yml 的关系：上游那条只向独立构建仓库派发，本仓库自身不编译，
# fork 里也没有那个构建仓库的 secrets。开发迭代需要点一下就有一套可用产物，
# 所以这条工作流把编译搬回本仓库自跑，它不替代发版流程：正式发版仍然走
# tag、构建仓库、官方签名那条路
#
# 签名：配了 AGENT2API_PLUGIN_KEY secret 就出签名包，没配则保持未签名
# （复合 action 只告警不失败），未签名包网关允许安装，界面标黄
#
# 产物：两个 agent2api-providers-<version>-<target>.zip，目录结构与
# scripts/pack.mjs 的契约一致（pack.json + bin/<三元组入口> + ui/ +
# licenses/），可在网关「提供商插件 → 安装插件包」直接安装，
# 平台口径：Docker 部署只出 amd64 镜像，对应 x86_64-unknown-linux-gnu，
# Windows 走 msvc 原生
#
# Linux x86_64 编译基线沿用网关仓库的 .cargo/config.toml 参数，
# 禁止使用 target-cpu=native 与依赖 AVX 的编译选项

on:
  workflow_dispatch:
    inputs:
      clean_cache:
        description: 清理旧 Rust 缓存
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # 清理缓存只需在 Linux 任务里做一次，不再为它单独起一个任务。
      - name: 清理旧 Rust 缓存
        if: inputs.clean_cache && runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.key | startswith("v0-rust-")) | .id')"
          count=0
          while IFS= read -r id; do
            if [[ -n "$id" ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/$id" >/dev/null
              count=$((count + 1))
            fi
          done <<< "$ids"
          echo "已清理旧 Rust 缓存 $count 条"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86-64-baseline-v1

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 校验版本基线
        shell: bash
        run: |
          set -euo pipefail
          # 插件包版本号（pack.json）与编译进二进制的版本（workspace Cargo.toml）
          # 必须一致，否则产物的包名与运行时自报版本会漂移
          pack="$(node -p "require('./pack.json').version")"
          cargo_version="$(cargo pkgid -p agent2api-providers | sed 's/.*@//')"
          if [[ -z "$pack" || "$pack" != "$cargo_version" ]]; then
            echo "::error::版本号不一致：pack.json=$pack Cargo=$cargo_version"
            exit 1
          fi
          echo "版本基线一致：$pack"

      - name: 编译 release 产物
        run: cargo build --release -p agent2api-providers

      - name: 打包
        run: node scripts/pack.mjs --target ${{ matrix.target }} --skip-build

      - name: 签名（配了密钥才生效）
        uses: ./.github/actions/sign-pack
        with:
          key: ${{ secrets.AGENT2API_PLUGIN_KEY }}

      - uses: actions/upload-artifact@v7
        with:
          name: pack-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: 计算版本号与 tag
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./pack.json').version")"
          case "$VERSION" in
            ''|*[!0-9A-Za-z.+-]*) echo "版本号不合法: $VERSION" >&2; exit 1 ;;
          esac
          TAG="v${VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 发布草稿 Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # 同版本重复构建时覆盖旧草稿；已发布的同 tag 加后缀区分
          TAG="${{ steps.meta.outputs.tag }}"
          state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$state" == "true" ]]; then
            gh release delete "$TAG" --yes
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$TAG" 2>/dev/null || true
          elif [[ -n "$state" ]]; then
            TAG="$TAG-r${{ github.run_number }}"
          fi
          # 发布说明按当前版本取，文件缺失时退回最小说明，避免版本升级后
          # 因文件名未同步而发布失败
          NOTES="docs/release-notes_${VERSION}.md"
          if [[ ! -f "$NOTES" ]]; then
            echo "::warning::未找到 $NOTES，使用最小发布说明"
            printf '版本 %s 构建\n\n- 变更文档缺失（%s），请补充后再发布正式版\n' "$VERSION" "$NOTES" > release-notes.generated.md
            NOTES="release-notes.generated.md"
          fi
          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --notes-file "$NOTES" \
            dist/*.zip
